name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check JavaScript syntax
        run: node --check app.js && node --check api/vendors.js && node --check api/contact.js
      - name: Build production bundle
        run: npm run build
